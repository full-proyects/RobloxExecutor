name: build-xpe

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Clonar el repo
        uses: actions/checkout@v4

      - name: Configurar MSBuild
        uses: microsoft/setup-msbuild@v2

      # Forzamos OutputPath para saber DONDE sale la DLL (no depende del OutDir del vcxproj)
      - name: Compilar con MSBuild
        run: msbuild Alpen.vcxproj /p:Configuration=Release /p:Platform=x64 /p:OutDir="C:\xpe\output\" /v:minimal

      # Copiar de C:\xpe\output\module.dll a xpe.dll en el repo
      - name: Copiar a xpe.dll
        shell: cmd
        run: |
          copy /Y "C:\xpe\output\module.dll" "xpe.dll"
          dir xpe.dll

      - name: Subir xpe.dll como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: xpe-dll
          path: xpe.dll