# ============================================================
#  xpe executor - Stealth Proyect (xpe.nettt)
#  Compila xpe.dll en GitHub cada vez que subes un update.
#  Descarga el resultado en: repo > Actions > artifact "xpe-dll"
# ============================================================
name: build-xpe

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # boton "Run workflow" para forzar la compilacion

jobs:
  build:
    runs-on: windows-latest   # trae Visual Studio 2022 con C++ completo

    steps:
      - name: Clonar el repo
        uses: actions/checkout@v4

      # Pone msbuild en el PATH (el motivo del error anterior)
      - name: Configurar MSBuild
        uses: microsoft/setup-msbuild@v2

      # Compila el proyecto Alpen (Release x64) -> genera module.dll
      - name: Compilar con MSBuild
        run: msbuild Alpen.vcxproj /p:Configuration=Release /p:Platform=x64 /v:minimal

      # Renombrar module.dll -> xpe.dll (el nombre que pediste)
      - name: Renombrar a xpe.dll
        run: copy /Y "Alpen\x64\Release\module.dll" "Alpen\x64\Release\xpe.dll"

      # Te deja xpe.dll lista para descargar
      - name: Subir xpe.dll como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: xpe-dll
          path: Alpen/x64/Release/xpe.dll