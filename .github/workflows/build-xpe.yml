# ============================================================
#  xpe executor - Stealth Proyect (xpe.nettt)
#  Compila xpe.dll en GitHub cada vez que subes un update.
#  Descarga el resultado en: repo > Actions > artifact "xpe-dll"
# ============================================================
name: build-xpe

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # boton "Run workflow" para forzar la compilacion

jobs:
  build:
    runs-on: windows-latest   # trae Visual Studio completo con C++

    steps:
      - name: Clonar el repo
        uses: actions/checkout@v4

      # Pone msbuild en el PATH
      - name: Configurar MSBuild
        uses: microsoft/setup-msbuild@v2

      # Compila el proyecto Alpen (Release x64). El proyecto define su propio
      # OutDir (dentro de la carpeta de Roblox), asi que despues buscamos
      # la module.dll donde haya salido y la copiamos.
      - name: Compilar con MSBuild
        run: msbuild Alpen.vcxproj /p:Configuration=Release /p:Platform=x64 /v:minimal

      # Buscar module.dll donde salio, copiarla como xpe.dll en la raiz del repo
      - name: Buscar y renombrar a xpe.dll
        shell: cmd
        run: |
          set DLL=
          for /r %%F in (module.dll) do set DLL=%%F
          echo Encontre: %DLL%
          copy /Y "%DLL%" "xpe.dll"

      # Te deja xpe.dll lista para descargar
      - name: Subir xpe.dll como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: xpe-dll
          path: xpe.dll