# ============================================================
#  xpe executor - Stealth Proyect (xpe.nettt)
#  Compila xpe.dll en GitHub cada vez que subes un update.
#  Descarga el resultado en: repo > Actions > artifact "xpe-dll"
# ============================================================
name: build-xpe

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # boton "Run workflow" para forzar la compilacion

jobs:
  build:
    runs-on: windows-latest   # trae Visual Studio completo con C++

    steps:
      - name: Clonar el repo
        uses: actions/checkout@v4

      # Pone msbuild en el PATH
      - name: Configurar MSBuild
        uses: microsoft/setup-msbuild@v2

      # Compila el proyecto Alpen (Release x64).
      # El proyecto define su OutDir dentro de la carpeta de Roblox, asi que
      # le forzamos un OutputPath local para poder encontrar la DLL facil.
      - name: Compilar con MSBuild
        run: msbuild Alpen.vcxproj /p:Configuration=Release /p:Platform=x64 /p:OutputPath="Alpen\x64\Release\" /v:minimal

      # Renombrar module.dll -> xpe.dll (shell cmd: aqui si existe "copy /Y")
      - name: Renombrar a xpe.dll
        shell: cmd
        run: copy /Y "Alpen\x64\Release\module.dll" "Alpen\x64\Release\xpe.dll"

      # Te deja xpe.dll lista para descargar
      - name: Subir xpe.dll como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: xpe-dll
          path: Alpen/x64/Release/xpe.dll